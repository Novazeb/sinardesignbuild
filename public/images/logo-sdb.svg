<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 338 84" width="338" height="84">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B889"/>
      <stop offset="50%" stop-color="#C4956A"/>
      <stop offset="100%" stop-color="#9E6F45"/>
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
  </defs>

  <!-- SDB Geometric Monogram Icon -->
  <g transform="translate(10, 8)">
    <!-- Architectural Diamond / Cube Frame -->
    <path d="M 34 2 L 64 19 L 64 51 L 34 68 L 4 51 L 4 19 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Internal Isometric Grid Lines -->
    <path d="M 34 2 L 34 68" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.35"/>
    <path d="M 4 19 L 64 51" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.35"/>
    <path d="M 4 51 L 64 19" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.35"/>
    
    <!-- Stylized S D B Letters in Isometric Badge -->
    <text x="34" y="44" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="22" fill="url(#whiteGrad)" text-anchor="middle" letter-spacing="2">SDB</text>
  </g>

  <!-- Typography -->
  <!-- Main Brand Name -->
  <text x="96" y="42" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="25" fill="#FFFFFF" letter-spacing="3.5">SINAR</text>
  
  <!-- Subheading / Tagline -->
  <text x="97" y="62" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600" font-size="11.5" fill="url(#goldGrad)" letter-spacing="4.8">DESIGN &amp; BUILD</text>
  
  <!-- Accent Line -->
  <line x1="97" y1="47" x2="310" y2="47" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.75"/>
</svg>

